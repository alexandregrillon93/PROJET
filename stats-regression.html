<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests Muscu Coach Pro</title>
<style>
  body { margin: 0; padding: 24px; background: #071522; color: #F4F8FC; font: 14px system-ui, sans-serif; }
  h1 { font-size: 20px; }
  li { margin: 8px 0; }
  .ok { color: #27D89B; }
  .fail { color: #FF9DAA; }
  .skip { color: #F2C94C; }
  iframe { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; }
</style>
</head>
<body>
<h1>Tests de non-régression</h1>
<ul id="results"></ul>
<iframe id="app" src="./index.html?tests=1"></iframe>
<script>
(async () => {
  const results = document.querySelector('#results');
  const report = (name, ok, detail = '') => {
    const item = document.createElement('li');
    item.className = ok ? 'ok' : 'fail';
    item.textContent = `${ok ? 'OK' : 'ÉCHEC'} · ${name}${detail ? ` — ${detail}` : ''}`;
    results.appendChild(item);
    if (!ok) throw new Error(name);
  };
  const skip = (name, detail) => {
    const item = document.createElement('li');
    item.className = 'skip';
    item.textContent = `IGNORÉ · ${name} — ${detail}`;
    results.appendChild(item);
  };
  const frame = document.querySelector('#app');
  await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  await new Promise(resolve => setTimeout(resolve, 900));
  const app = frame.contentWindow;
  report('validateur disponible', typeof app.validateImportBundle === 'function');
  report('images d’exercices autonomes', Object.values(app.EXERCISE_PHOTOS || {}).every(source => String(source).startsWith('data:image/')));
  report('aucun média externe requis', Object.values(app.EXERCISE_REMOTE_PHOTOS || {}).every(source => !/^https?:/i.test(String(source))));
  report('séries au poids du corps comptées sans charge', app.isSetPerformed({ reps: '10', weight: '' }, { isBodyweight: true }));
  report('séries lestées sans charge non comptées', !app.isSetPerformed({ reps: '10', weight: '' }, { isBodyweight: false }));
  const { monday } = app.currentWeekRange();
  const previousMonday = new Date(monday);
  previousMonday.setDate(previousMonday.getDate() - 7);
  report('date de la semaine en cours modifiable', app.isDateInCurrentWeek(monday));
  report('séance d’une semaine passée verrouillée', !app.isDateInCurrentWeek(previousMonday));
  const staleDraft = { history: [{ date: previousMonday.toISOString() }], current: { date: previousMonday.toISOString(), exercises: { oldExercise: [{ reps: '10' }] }, sessionExercises: [{ id: 'oldExercise', name: 'Ancien exercice' }] } };
  const cleanedDraft = app.resetStaleCurrentSession(staleDraft);
  report('brouillon précédent écarté sans toucher à l’historique', cleanedDraft.current.date === null && !cleanedDraft.current.sessionExercises && cleanedDraft.history === staleDraft.history);
  const staleTimedDraft = { current: { date: null, startedAt: previousMonday.toISOString(), exercises: { oldExercise: [{ reps: '10' }] } } };
  const cleanedTimedDraft = app.resetStaleCurrentSession(staleTimedDraft);
  report('chronomètre d’un brouillon abandonné réinitialisé après changement de semaine', cleanedTimedDraft.current.date === null && !cleanedTimedDraft.current.startedAt && Object.keys(cleanedTimedDraft.current.exercises).length === 0);
  const currentDraft = { current: { date: monday.toISOString(), exercises: {}, sessionExercises: [{ id: 'currentExercise' }] } };
  report('brouillon de la semaine en cours conservé', app.resetStaleCurrentSession(currentDraft) === currentDraft);
  const timedDraft = { current: { date: monday.toISOString(), startedAt: '2026-10-22T10:15:00.000Z', exercises: {} } };
  report('horodatage de départ conservé avec le brouillon de séance', app.resetStaleCurrentSession(timedDraft).current.startedAt === timedDraft.current.startedAt);
  report('chronomètre affiché au format heures, minutes et secondes', app.formatSessionElapsedTime(3661) === '01:01:01' && app.formatSessionElapsedTime(59) === '00:00:59');
  const rotationAnswers = { equip: 'full', level: 'confirme', limitations: [] };
  const rotationProgram = [
    { exercises: [{ name: 'Shrugs barre', category: 'Trapèzes', target: '3x8-12', rest: 90 }] },
    { exercises: [] },
    { exercises: [{ name: 'Élévation en Y (Y-raise)', category: 'Trapèzes', target: '3x8-12', rest: 90 }] },
  ];
  const firstRotated = app.rotateAccessoryExercises(rotationProgram[0], rotationAnswers, 2, 0, rotationProgram);
  const secondRotated = app.rotateAccessoryExercises(rotationProgram[2], rotationAnswers, 2, 2, rotationProgram);
  report('tous les accessoires trapèzes tournent vers une portion distincte', firstRotated[0].name !== rotationProgram[0].exercises[0].name && secondRotated[0].name !== rotationProgram[2].exercises[0].name && firstRotated[0].portion !== secondRotated[0].portion);
  const manualProgram = rotationProgram.map((day, index) => index === 0
    ? { ...day, exercises: [{ ...day.exercises[0], name: 'Shrugs haltères', manualSwap: true }] }
    : day
  );
  report('choix manuel conservé malgré la rotation', app.rotateAccessoryExercises(manualProgram[0], rotationAnswers, 2, 0, manualProgram)[0].name === 'Shrugs haltères');
  const anchorProgram = [{ exercises: [{ name: 'Développé incliné haltères', category: 'Pectoraux', portion: 'Haut des pectoraux', target: '4x8-12', rest: 90 }] }];
  report('mouvement principal stable pendant la rotation', app.rotateAccessoryExercises(anchorProgram[0], rotationAnswers, 2, 0, anchorProgram)[0].name === 'Développé incliné haltères');
  const chestRotationProgram = [
    { exercises: [
      { name: 'Développé incliné haltères', category: 'Pectoraux', portion: 'Haut des pectoraux', target: '4x8-12', rest: 90 },
      { name: 'Écarté à la poulie vis-à-vis', category: 'Pectoraux', portion: 'Milieu des pectoraux', target: '3x10-15', rest: 60 }
    ] }
  ];
  const chestWeekOne = app.rotateAccessoryExercises(chestRotationProgram[0], rotationAnswers, 1, 0, chestRotationProgram);
  const chestWeekTwo = app.rotateAccessoryExercises(chestRotationProgram[0], rotationAnswers, 2, 0, chestRotationProgram);
  report('portion pectorale oubliée ajoutée en semaine 2 sans changer le mouvement principal', chestWeekTwo[0].name === chestWeekOne[0].name && chestWeekTwo[1].name !== chestWeekOne[1].name && chestWeekTwo[1].portion === 'Bas des pectoraux');
  report('couverture pectorale complète sur deux semaines avec un seul accessoire tournant', new Set([...chestWeekOne, ...chestWeekTwo].map(ex => ex.portion)).size === 3);
  const chestCoverage = app.getTwoWeekPortionCoverage(chestRotationProgram, rotationAnswers, 1);
  report('bilan de couverture sur deux semaines inclut la rotation et les séries prévues', chestCoverage.rows.filter(row => row.category === 'Pectoraux').length === 3 && chestCoverage.rows.filter(row => row.category === 'Pectoraux').every(row => row.sets > 0 && row.weeks.length > 0) && chestCoverage.score === 100);
  const bicepsProgram = [{ exercises: [
    { name: 'Curl incliné haltères', category: 'Biceps', portion: 'Biceps — longue portion', target: '3x8-12', rest: 90 },
    { name: 'Curl pupitre (banc Scott)', category: 'Biceps', portion: 'Biceps — courte portion', target: '3x8-12', rest: 90 }
  ] }];
  const rotatedBiceps = app.rotateAccessoryExercises(bicepsProgram[0], rotationAnswers, 2, 0, bicepsProgram);
  report('rotation hebdomadaire des accessoires bras sans garder les variantes précédentes', rotatedBiceps.every((ex, index) => ex.name !== bicepsProgram[0].exercises[index].name) && new Set(rotatedBiceps.map(ex => ex.portion)).size === 2);
  const weeklyAnswers = { goal: 'recomposition', days: 4, duration: 'moyen', level: 'confirme', equip: 'full', renforcement: 'non', recovery: 'moyenne', preference: 'mix', training_style: 'classique', limitations: [], priority: [] };
  const shortSessionCheck = app.analyzeProgram(
    [{ title: 'Séance courte', exercises: [{ name: 'Curl incliné haltères', category: 'Biceps', target: '2x8-12', rest: 60 }] }],
    weeklyAnswers
  );
  report('séances estimées sous la durée cible signalées dans le bilan', shortSessionCheck.issues.some(issue => issue.startsWith('Séances sous la durée cible')));
  const generationMatrix = (() => {
    const goals = ['force', 'hypertrophie', 'perte_gras', 'recomposition'];
    const durations = ['court', 'moyen', 'long'];
    const levels = ['debutant', 'intermediaire', 'confirme'];
    const equipment = ['full', 'basic', 'dumbbell', 'barbell', 'bodyweight'];
    let checked = 0;
    let failure = '';
    for (const days of [2, 3, 4, 5]) {
      for (const duration of durations) {
        for (const level of levels) {
          for (const goal of goals) {
            for (const equip of equipment) {
              for (const renforcement of ['non', 'oui']) {
                const answers = { ...weeklyAnswers, days, duration, level, goal, equip, renforcement };
                const program = app.generateProgram(answers);
                const weeklySetTotals = {};
                checked++;
                for (const [dayIndex, day] of program.entries()) {
                  if (!day.exercises.length) {
                    failure = `séance vide pour ${days} jours, ${duration}, ${level}, ${goal}, ${equip}`;
                    break;
                  }
                  const names = day.exercises.map(ex => ex.name);
                  if (new Set(names).size !== names.length) {
                    failure = `doublon dans ${day.title} (${days} jours, ${duration}, ${level}, ${goal}, ${equip})`;
                    break;
                  }
                  if (day.exercises.length > app.getDurationProfile(duration).maxExercises) {
                    failure = `plafond d’exercices dépassé dans ${day.title} (${days} jours, ${duration}, ${level}, ${goal}, ${equip})`;
                    break;
                  }
                  for (const exercise of day.exercises) {
                    const available = app.filterPool(exercise.category, equip, [], level, true)
                      .some(candidate => candidate.name === exercise.name);
                    if (!available) {
                      failure = `matériel incompatible pour ${exercise.name} (${equip})`;
                      break;
                    }
                    if (!app.isGroupAllowedOnDay(exercise.category, day.title)) {
                      failure = `${exercise.category} placé dans ${day.title}`;
                      break;
                    }
                    if (!exercise.isRenforcement
                      && exercise.target.split('x').slice(1).join('x') !== app.getExerciseRepRange(exercise, goal)) {
                      failure = `répétitions incohérentes pour ${exercise.name} (${goal})`;
                      break;
                    }
                    if (!exercise.isRenforcement) {
                      weeklySetTotals[exercise.category] = (weeklySetTotals[exercise.category] || 0)
                        + app.parseSetCount(exercise.target);
                    }
                  }
                  if (failure) break;
                  const rotated = app.rotateAccessoryExercises(day, answers, 2, dayIndex, program);
                  if (new Set(rotated.map(ex => ex.name)).size !== rotated.length) {
                    failure = `doublon après rotation dans ${day.title} (${days} jours, ${duration}, ${level}, ${goal}, ${equip})`;
                  }
                  for (const exercise of rotated) {
                    if (!exercise.isRenforcement
                      && exercise.target.split('x').slice(1).join('x') !== app.getExerciseRepRange(exercise, goal)) {
                      failure = `répétitions incohérentes après rotation pour ${exercise.name} (${goal})`;
                      break;
                    }
                  }
                  if (failure) break;
                }
                if (!failure) {
                  const weeklyTargets = app.getWeeklyVolumeTargets(answers);
                  for (const [group, sets] of Object.entries(weeklySetTotals)) {
                    if (weeklyTargets[group] && sets > weeklyTargets[group] + 1) {
                      failure = `volume hebdomadaire dépassé pour ${group} (${sets}/${weeklyTargets[group]} séries)`;
                      break;
                    }
                  }
                }
                if (failure) break;
              }
              if (failure) break;
            }
            if (failure) break;
          }
          if (failure) break;
        }
        if (failure) break;
      }
      if (failure) break;
    }
    return { checked, failure };
  })();
  report('matrice de génération et rotation — 1 440 programmes vérifiés pour doublons, volume, matériel, split et répétitions', !generationMatrix.failure, generationMatrix.failure || `${generationMatrix.checked} combinaisons vérifiées`);
  const optionMatrix = (() => {
    const styles = ['classique', 'biset', 'superset'];
    const preferences = ['mix', 'libres', 'machines'];
    const limitations = [[], ['dos'], ['genoux'], ['epaules']];
    let checked = 0;
    let failure = '';
    for (const days of [2, 3, 4, 5]) {
      for (const level of ['debutant', 'intermediaire', 'confirme']) {
        for (const training_style of styles) {
          for (const preference of preferences) {
            for (const limitation of limitations) {
              const answers = {
                ...weeklyAnswers,
                days,
                level,
                training_style,
                preference,
                limitations: limitation,
                priority: ['Pectoraux', 'Dos'],
                renforcement: 'oui',
              };
              const program = app.generateProgram(answers);
              checked++;
              for (const day of program) {
                if (day.exercises.some(ex => (ex.riskTags || []).some(tag => limitation.includes(tag)))) {
                  failure = `mouvement non adapté à la limitation ${limitation.join(', ')} (${days} jours, ${level})`;
                  break;
                }
                const maxGroupSize = training_style === 'biset' ? 2 : 3;
                if ((day.supersets || []).some(group => group.length < 2
                  || group.length > maxGroupSize
                  || group.some(index => index < 0 || index >= day.exercises.length))) {
                  failure = `groupe de séries invalide (${training_style}, ${days} jours, ${level})`;
                  break;
                }
                if (training_style === 'classique' && day.supersets?.length) {
                  failure = `superset présent en séries classiques (${days} jours, ${level})`;
                  break;
                }
              }
              if (failure) break;
            }
            if (failure) break;
          }
          if (failure) break;
        }
        if (failure) break;
      }
      if (failure) break;
    }
    return { checked, failure };
  })();
  report('options — 432 combinaisons de préférences, limitations, priorités et styles', !optionMatrix.failure, optionMatrix.failure || `${optionMatrix.checked} combinaisons vérifiées`);
  const weeklyProgram = app.generateProgram(weeklyAnswers);
  const coverageAcrossFrequencies = [2, 3, 4, 5].every(days => {
    const answers = { ...weeklyAnswers, days };
    const program = app.generateProgram(answers);
    const coverage = app.getTwoWeekPortionCoverage(program, answers, 3);
    return coverage.score >= 0 && coverage.score <= 100 && coverage.rows.length > 0 && coverage.rows.every(row => Array.isArray(row.weeks) && row.weeks.every(week => week === 3 || week === 4));
  });
  report('prévision anatomique valide pour les programmes de 2 à 5 jours', coverageAcrossFrequencies);
  const balancedPlansRespectDuration = ['court', 'moyen', 'long'].every(duration => [2, 3, 4, 5].every(days => {
    const answers = { ...weeklyAnswers, days, duration };
    const program = app.generateProgram(answers);
    return program.every((day, dayIndex) => {
      const exercises = app.rotateAccessoryExercises(day, answers, 2, dayIndex, program);
      const sets = app.getDurationSafeSetPlan({ ...day, exercises }, answers, 2);
      const plannedDay = { ...day, exercises: exercises.map((ex, index) => ({ ...ex, target: `${sets[index]}x${ex.target.split('x').slice(1).join('x')}` })) };
      const durationMax = { court: 45, moyen: 60, long: 90 }[duration];
      return sets.every(count => count >= 2) && app.estimateSessionMinutes(plannedDay, answers) <= durationMax;
    });
  }));
  report('minimum de 2 séries hors deload sans dépasser la durée choisie (2 à 5 jours)', balancedPlansRespectDuration);
  const plannedSetsPreserved = weeklyProgram.every(day => {
    const plan = app.getDurationSafeSetPlan(day, weeklyAnswers, 2);
    return day.exercises.every((ex, index) => parseInt(ex.target.split('x')[0], 10) <= 1 || plan[index] >= 2);
  });
  report('exercices de tous les muscles gardent leurs séries planifiées hors deload', plannedSetsPreserved);
  const rotatedWeeklyProgram = weeklyProgram.map((day, index) => ({
    ...day,
    exercises: app.rotateAccessoryExercises(day, weeklyAnswers, 2, index, weeklyProgram)
  }));
  const rotatingArmsUpdated = ['Biceps', 'Triceps'].every(category => {
    const previous = weeklyProgram.flatMap(day => day.exercises || []).filter(ex => ex.category === category && !ex.manualSwap && !/développé|developpe|squat|soulevé de terre|souleve de terre|fente|hip thrust|dips|pompe|rowing barre|tirage horizontal/i.test(ex.name));
    const current = rotatedWeeklyProgram.flatMap(day => day.exercises || []).filter(ex => ex.category === category && !ex.manualSwap && !/développé|developpe|squat|soulevé de terre|souleve de terre|fente|hip thrust|dips|pompe|rowing barre|tirage horizontal/i.test(ex.name));
    return previous.length === current.length && previous.every(ex => !current.some(next => next.name === ex.name));
  });
  report('accessoires des bras actualisés dans toutes les séances de la semaine', rotatingArmsUpdated);
  const explicitSingle = { exercises: [{ name: 'Élévation latérale', category: 'Épaules', target: '1x8-12', rest: 90 }] };
  const deloadSingle = { exercises: [{ name: 'Curl incliné', category: 'Biceps', target: '2x8-12', rest: 90 }] };
  report('exercice normal planifié à 1 série passe à 2', app.getDurationSafeSetPlan(explicitSingle, weeklyAnswers, 2)[0] === 2);
  report('semaine de deload conserve sa réduction', app.getDurationSafeSetPlan(deloadSingle, weeklyAnswers, 8)[0] === 1);
  const weeklyPortionRotation = Object.entries({
    Pectoraux: 3, Dos: 3, Épaules: 3, Trapèzes: 3, Biceps: 3, Triceps: 3,
    Jambes: 2, 'Ischios/Fessiers': 2, Mollets: 2, Core: 3,
    'Avant-bras': 4, 'Adducteurs/Abducteurs': 3
  }).every(([category, requiredCount]) => {
    const portions = weeklyProgram.flatMap(day => day.exercises || [])
      .filter(ex => ex.category === category && !ex.isRenforcement)
      .map(ex => ex.portion)
      .filter(Boolean);
    return new Set(portions).size >= Math.min(portions.length, requiredCount);
  });
  report('portions anatomiques réparties sans doublon inutile sur la semaine', weeklyPortionRotation);
  const stored = await app.storage.get('custom-program');
  const hasSavedProgram = !!stored?.value;
  const snapshot = hasSavedProgram ? JSON.parse(stored.value) : {
    answers: weeklyAnswers,
    program: weeklyProgram,
    date: new Date().toISOString(),
    cycleWeeks: 8,
    lastUpdated: new Date().toISOString()
  };
  const base = { app: 'Muscu Coach Pro', version: 20, customProgram: snapshot, sessions: {}, trainingLog: [], bodyweightLog: [], calorieLog: [], freestyleLog: [], cycleFeedback: [] };
  report('sauvegarde valide acceptée', app.validateImportBundle(base).ok);
  report('version future refusée', !app.validateImportBundle({ ...base, version: 999 }).ok);
  report('liste invalide refusée', !app.validateImportBundle({ ...base, trainingLog: {} }).ok);
  const statsButton = [...app.document.querySelectorAll('button')].find(button => button.textContent.includes('Stats'));
  if (statsButton) {
    report('accès aux statistiques', !!statsButton);
    statsButton.click();
    await new Promise(resolve => setTimeout(resolve, 900));
    report('libellé des volumes explicite', app.document.body.textContent.includes('Volume attribué par groupe musculaire') && app.document.body.textContent.includes('Couverture prévue sur 2 semaines'));
  } else {
    skip('interface des statistiques', 'aucun écran de programme actif dans le navigateur de test');
  }
})();
</script>
</body>
</html>
