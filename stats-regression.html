<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tests Muscu Coach Pro</title>
<style>
  body { margin: 0; padding: 24px; background: #071522; color: #F4F8FC; font: 14px system-ui, sans-serif; }
  h1 { font-size: 20px; }
  li { margin: 8px 0; }
  .ok { color: #27D89B; }
  .fail { color: #FF9DAA; }
  .skip { color: #F2C94C; }
  iframe { position: absolute; width: 1px; height: 1px; border: 0; opacity: 0; }
</style>
</head>
<body>
<h1>Tests de non-régression</h1>
<ul id="results"></ul>
<iframe id="app" src="./index.html?tests=1"></iframe>
<script>
(async () => {
  const results = document.querySelector('#results');
  const report = (name, ok, detail = '') => {
    const item = document.createElement('li');
    item.className = ok ? 'ok' : 'fail';
    item.textContent = `${ok ? 'OK' : 'ÉCHEC'} · ${name}${detail ? ` — ${detail}` : ''}`;
    results.appendChild(item);
    if (!ok) throw new Error(name);
  };
  const skip = (name, detail) => {
    const item = document.createElement('li');
    item.className = 'skip';
    item.textContent = `IGNORÉ · ${name} — ${detail}`;
    results.appendChild(item);
  };
  const frame = document.querySelector('#app');
  await new Promise(resolve => frame.addEventListener('load', resolve, { once: true }));
  await new Promise(resolve => setTimeout(resolve, 900));
  const app = frame.contentWindow;
  report('validateur disponible', typeof app.validateImportBundle === 'function');
  report('images d’exercices autonomes', Object.values(app.EXERCISE_PHOTOS || {}).every(source => String(source).startsWith('data:image/')));
  report('aucun média externe requis', Object.values(app.EXERCISE_REMOTE_PHOTOS || {}).every(source => !/^https?:/i.test(String(source))));
  report('séries au poids du corps comptées sans charge', app.isSetPerformed({ reps: '10', weight: '' }, { isBodyweight: true }));
  report('séries lestées sans charge non comptées', !app.isSetPerformed({ reps: '10', weight: '' }, { isBodyweight: false }));
  const { monday } = app.currentWeekRange();
  const previousMonday = new Date(monday);
  previousMonday.setDate(previousMonday.getDate() - 7);
  report('date de la semaine en cours modifiable', app.isDateInCurrentWeek(monday));
  report('séance d’une semaine passée verrouillée', !app.isDateInCurrentWeek(previousMonday));
  const staleDraft = { history: [{ date: previousMonday.toISOString() }], current: { date: previousMonday.toISOString(), exercises: { oldExercise: [{ reps: '10' }] }, sessionExercises: [{ id: 'oldExercise', name: 'Ancien exercice' }] } };
  const cleanedDraft = app.resetStaleCurrentSession(staleDraft);
  report('brouillon précédent écarté sans toucher à l’historique', cleanedDraft.current.date === null && !cleanedDraft.current.sessionExercises && cleanedDraft.history === staleDraft.history);
  const currentDraft = { current: { date: monday.toISOString(), exercises: {}, sessionExercises: [{ id: 'currentExercise' }] } };
  report('brouillon de la semaine en cours conservé', app.resetStaleCurrentSession(currentDraft) === currentDraft);
  const rotationAnswers = { equip: 'full', level: 'confirme', limitations: [] };
  const rotationProgram = [
    { exercises: [{ name: 'Shrugs barre', category: 'Trapèzes', target: '3x8-12', rest: 90 }] },
    { exercises: [] },
    { exercises: [{ name: 'Élévation en Y (Y-raise)', category: 'Trapèzes', target: '3x8-12', rest: 90 }] },
  ];
  const firstRotated = app.rotateAccessoryExercises(rotationProgram[0], rotationAnswers, 2, 0, rotationProgram);
  const secondRotated = app.rotateAccessoryExercises(rotationProgram[2], rotationAnswers, 2, 2, rotationProgram);
  report('tous les accessoires trapèzes tournent vers une portion distincte', firstRotated[0].name !== rotationProgram[0].exercises[0].name && secondRotated[0].name !== rotationProgram[2].exercises[0].name && firstRotated[0].portion !== secondRotated[0].portion);
  const manualProgram = rotationProgram.map((day, index) => index === 0
    ? { ...day, exercises: [{ ...day.exercises[0], name: 'Shrugs haltères', manualSwap: true }] }
    : day
  );
  report('choix manuel conservé malgré la rotation', app.rotateAccessoryExercises(manualProgram[0], rotationAnswers, 2, 0, manualProgram)[0].name === 'Shrugs haltères');
  const anchorProgram = [{ exercises: [{ name: 'Développé incliné haltères', category: 'Pectoraux', portion: 'Haut des pectoraux', target: '4x8-12', rest: 90 }] }];
  report('mouvement principal stable pendant la rotation', app.rotateAccessoryExercises(anchorProgram[0], rotationAnswers, 2, 0, anchorProgram)[0].name === 'Développé incliné haltères');
  const bicepsProgram = [{ exercises: [
    { name: 'Curl incliné haltères', category: 'Biceps', portion: 'Biceps — longue portion', target: '3x8-12', rest: 90 },
    { name: 'Curl pupitre (banc Scott)', category: 'Biceps', portion: 'Biceps — courte portion', target: '3x8-12', rest: 90 }
  ] }];
  const rotatedBiceps = app.rotateAccessoryExercises(bicepsProgram[0], rotationAnswers, 2, 0, bicepsProgram);
  report('rotation hebdomadaire des accessoires bras sans garder les variantes précédentes', rotatedBiceps.every((ex, index) => ex.name !== bicepsProgram[0].exercises[index].name) && new Set(rotatedBiceps.map(ex => ex.portion)).size === 2);
  const weeklyAnswers = { goal: 'recomposition', days: 4, duration: 'moyen', level: 'confirme', equip: 'full', renforcement: 'non', recovery: 'moyenne', preference: 'mix', training_style: 'classique', limitations: [], priority: [] };
  const weeklyProgram = app.generateProgram(weeklyAnswers);
  const plannedSetsPreserved = weeklyProgram.every(day => {
    const plan = app.getDurationSafeSetPlan(day, weeklyAnswers, 2);
    return day.exercises.every((ex, index) => parseInt(ex.target.split('x')[0], 10) <= 1 || plan[index] >= 2);
  });
  report('exercices de tous les muscles gardent leurs séries planifiées hors deload', plannedSetsPreserved);
  const rotatedWeeklyProgram = weeklyProgram.map((day, index) => ({
    ...day,
    exercises: app.rotateAccessoryExercises(day, weeklyAnswers, 2, index, weeklyProgram)
  }));
  const rotatingArmsUpdated = ['Biceps', 'Triceps'].every(category => {
    const previous = weeklyProgram.flatMap(day => day.exercises || []).filter(ex => ex.category === category && !ex.manualSwap && !/développé|developpe|squat|soulevé de terre|souleve de terre|fente|hip thrust|dips|pompe|rowing barre|tirage horizontal/i.test(ex.name));
    const current = rotatedWeeklyProgram.flatMap(day => day.exercises || []).filter(ex => ex.category === category && !ex.manualSwap && !/développé|developpe|squat|soulevé de terre|souleve de terre|fente|hip thrust|dips|pompe|rowing barre|tirage horizontal/i.test(ex.name));
    return previous.length === current.length && previous.every(ex => !current.some(next => next.name === ex.name));
  });
  report('accessoires des bras actualisés dans toutes les séances de la semaine', rotatingArmsUpdated);
  const explicitSingle = { exercises: [{ name: 'Élévation latérale', category: 'Épaules', target: '1x8-12', rest: 90 }] };
  const deloadSingle = { exercises: [{ name: 'Curl incliné', category: 'Biceps', target: '2x8-12', rest: 90 }] };
  report('série accessoire volontaire conservée', app.getDurationSafeSetPlan(explicitSingle, weeklyAnswers, 2)[0] === 1);
  report('semaine de deload conserve sa réduction', app.getDurationSafeSetPlan(deloadSingle, weeklyAnswers, 8)[0] === 1);
  const weeklyPortionRotation = Object.entries({
    Pectoraux: 3, Dos: 3, Épaules: 3, Trapèzes: 3, Biceps: 3, Triceps: 3,
    Jambes: 2, 'Ischios/Fessiers': 2, Mollets: 2, Core: 3,
    'Avant-bras': 4, 'Adducteurs/Abducteurs': 3
  }).every(([category, requiredCount]) => {
    const portions = weeklyProgram.flatMap(day => day.exercises || [])
      .filter(ex => ex.category === category && !ex.isRenforcement)
      .map(ex => ex.portion)
      .filter(Boolean);
    return new Set(portions).size >= Math.min(portions.length, requiredCount);
  });
  report('portions anatomiques réparties sans doublon inutile sur la semaine', weeklyPortionRotation);
  const stored = await app.storage.get('custom-program');
  const hasSavedProgram = !!stored?.value;
  const snapshot = hasSavedProgram ? JSON.parse(stored.value) : {
    answers: weeklyAnswers,
    program: weeklyProgram,
    date: new Date().toISOString(),
    cycleWeeks: 8,
    lastUpdated: new Date().toISOString()
  };
  const base = { app: 'Muscu Coach Pro', version: 20, customProgram: snapshot, sessions: {}, trainingLog: [], bodyweightLog: [], calorieLog: [], freestyleLog: [], cycleFeedback: [] };
  report('sauvegarde valide acceptée', app.validateImportBundle(base).ok);
  report('version future refusée', !app.validateImportBundle({ ...base, version: 999 }).ok);
  report('liste invalide refusée', !app.validateImportBundle({ ...base, trainingLog: {} }).ok);
  const statsButton = [...app.document.querySelectorAll('button')].find(button => button.textContent.includes('Stats'));
  if (statsButton) {
    report('accès aux statistiques', !!statsButton);
    statsButton.click();
    await new Promise(resolve => setTimeout(resolve, 900));
    report('libellé des volumes explicite', app.document.body.textContent.includes('Volume attribué par groupe musculaire'));
  } else {
    skip('interface des statistiques', 'aucun écran de programme actif dans le navigateur de test');
  }
})();
</script>
</body>
</html>
