<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#181B18">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./icon-192.png">
<link rel="icon" href="./icon-192.png">
<title>Muscu Coach Pro — Coach intelligent</title>

<script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  html, body { margin: 0; padding: 0; background: #181B18; }
  #root { min-height: 100vh; }
  @keyframes mcPulse { 0%,100%{transform:scale(1);opacity:.82} 50%{transform:scale(1.04);opacity:1} }
  @keyframes mcShine { 0%{transform:translateX(-120%)} 55%,100%{transform:translateX(120%)} }
  @keyframes mcFadeUp { from{opacity:0;transform:translateY(18px)} to{opacity:1;transform:translateY(0)} }
  .mc-splash { position:fixed; inset:0; z-index:9999; display:flex; align-items:center; justify-content:center; overflow:hidden; background:#080A0D; }
  .mc-splash video { position:absolute; inset:0; width:100%; height:100%; object-fit:cover; opacity:.42; filter:saturate(1.15) contrast(1.08); }
  .mc-splash:after { content:""; position:absolute; inset:0; background:radial-gradient(circle at 50% 42%, rgba(20,125,255,.18), transparent 36%), linear-gradient(180deg,rgba(0,0,0,.3),rgba(0,0,0,.82)); }
  .mc-splash-card { position:relative; z-index:2; width:min(88vw,390px); text-align:center; animation:mcFadeUp .8s ease both; }
  .mc-splash-logo { width:118px;height:118px;object-fit:cover;border-radius:32px;display:block;margin:0 auto 18px;box-shadow:0 0 45px rgba(20,180,255,.38);animation:mcPulse 2.1s ease-in-out infinite; }
  .mc-splash-title { font-family:Impact,'Arial Black',sans-serif; font-size:34px; letter-spacing:.08em; color:#fff; text-shadow:0 3px 18px #000; }
  .mc-splash-sub { margin-top:6px; font-size:12px; letter-spacing:.22em; color:#9FDFFF; text-transform:uppercase; }
  .mc-progress { position:relative; height:5px; overflow:hidden; margin:26px auto 0; width:210px; border-radius:999px; background:rgba(255,255,255,.13); }
  .mc-progress span { position:absolute; inset:0; width:55%; background:linear-gradient(90deg,#0AB7FF,#fff,#FF8B2B); border-radius:999px; animation:mcShine 1.8s ease-in-out infinite; }
  .mc-splash-hint { margin-top:12px; color:#8A9099; font-size:11px; }
  .mc-home-hero { background:radial-gradient(circle at 90% 0%,rgba(0,183,255,.20),transparent 42%),linear-gradient(135deg,#111A25,#0B1017); border:1px solid rgba(0,183,255,.28); box-shadow:0 18px 45px rgba(0,0,0,.25); }
  .mc-mini-stat { background:rgba(255,255,255,.045); border:1px solid rgba(255,255,255,.08); border-radius:12px; padding:8px 7px; text-align:center; }
  .mc-mini-stat span { display:block; color:#7E8998; font:9px 'IBM Plex Mono',monospace; text-transform:uppercase; letter-spacing:.05em; }
  .mc-mini-stat strong { display:block; margin-top:3px; color:#fff; font:700 12px 'IBM Plex Mono',monospace; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }

/* V8 visual system — faithful to the generated Muscu Coach reference */
.mc-shell{
  background:
    radial-gradient(900px 500px at 50% -80px, rgba(18,130,255,.18), transparent 62%),
    radial-gradient(700px 420px at 100% 25%, rgba(102,64,255,.09), transparent 60%),
    linear-gradient(180deg,#030A12 0%,#06121F 52%,#030A12 100%) !important;
}

.mc-brand-logo{
  width:34px;height:34px;object-fit:cover;border-radius:10px;
  border:1px solid rgba(70,185,255,.55);
  box-shadow:0 0 22px rgba(0,174,255,.22);
  display:block;flex:0 0 auto;
}
.mc-media-card{position:relative;overflow:hidden;border-radius:18px;border:1px solid rgba(44,143,211,.45);background:#071522;box-shadow:0 18px 42px rgba(0,0,0,.36)}
.mc-media-card img{display:block;width:100%;height:132px;object-fit:cover;filter:saturate(1.08) contrast(1.05)}
.mc-media-card:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(2,9,15,.88));pointer-events:none}
.mc-media-copy{position:absolute;z-index:2;left:14px;right:14px;bottom:12px}
.mc-media-copy .kicker{font:700 9px 'IBM Plex Mono',monospace;color:#54D4FF;letter-spacing:.12em;text-transform:uppercase}
.mc-media-copy .title{font:800 21px 'Big Shoulders Display','Arial Narrow',sans-serif;color:#fff;text-transform:uppercase;line-height:1;margin-top:3px}
.mc-set-grid{border-radius:12px;padding:7px 5px;background:linear-gradient(145deg,rgba(11,34,55,.96),rgba(5,18,29,.98));border:1px solid rgba(29,86,122,.65)}
.mc-set-grid input{min-height:38px;text-align:center;font-size:16px!important;border-radius:10px!important}
.mc-set-grid button{min-width:34px;min-height:34px}
.mc-timed-badge{display:inline-flex;align-items:center;gap:5px;padding:4px 7px;border-radius:999px;background:rgba(0,174,255,.10);border:1px solid rgba(0,174,255,.30);color:#9FE5FF;font:700 9px 'IBM Plex Mono',monospace}

.mc-glass{
  background:linear-gradient(145deg,rgba(9,28,45,.97),rgba(4,14,25,.98)) !important;
  border:1px solid rgba(35,133,207,.38) !important;
  box-shadow:0 20px 48px rgba(0,0,0,.38),inset 0 1px 0 rgba(255,255,255,.04) !important;
}
.mc-neon{box-shadow:0 0 0 1px rgba(0,174,255,.35),0 0 34px rgba(0,174,255,.15),0 20px 50px rgba(0,0,0,.38)!important;}
.mc-stat{
  background:linear-gradient(145deg,#0B2237,#071523) !important;
  border:1px solid #174C70 !important;
  border-radius:14px !important;
}
.mc-stat strong{font-size:19px !important;color:#fff !important;}
.mc-progress-fill{background:linear-gradient(90deg,#1478FF,#00BFFF,#25E0A1)!important;}
.mc-chip{background:rgba(8,30,49,.92)!important;border-color:#1C5379!important;color:#B9D8E9!important;}
.mc-bottom-nav{
  background:rgba(3,13,22,.96)!important;
  border:1px solid rgba(22,105,161,.55)!important;
  box-shadow:0 18px 55px rgba(0,0,0,.55),0 0 30px rgba(0,130,255,.08)!important;
}
.mc-bottom-nav button.active{
  background:linear-gradient(180deg,rgba(0,174,255,.18),rgba(0,100,255,.08))!important;
  color:#fff!important;
}
.mc-feature-strip{
  display:grid;
  grid-template-columns:repeat(5,minmax(118px,1fr));
  gap:7px;
  overflow-x:auto;
  scrollbar-width:none;
  padding-bottom:2px;
}
.mc-feature-strip::-webkit-scrollbar{display:none}
.mc-feature-tile{
  min-width:118px;height:74px;border-radius:13px;overflow:hidden;position:relative;
  border:1px solid rgba(47,139,201,.42);background:#071522;
  box-shadow:0 10px 24px rgba(0,0,0,.3);
}
.mc-feature-tile img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.08) contrast(1.05);background:linear-gradient(135deg,#0B2237,#06101A)}
.mc-feature-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,.05),rgba(0,8,16,.9))}
.mc-feature-label{
  position:absolute;left:9px;bottom:19px;color:#fff;font:800 12px 'Big Shoulders Display','Arial Narrow',sans-serif;letter-spacing:.08em;
}
.mc-feature-caption{position:absolute;left:9px;bottom:6px;color:#9FC3D8;font-size:7px;white-space:nowrap}
.mc-global-identity{padding:0 16px;margin-top:2px}
.mc-global-identity .mc-feature-strip{grid-template-columns:repeat(5,minmax(108px,1fr));gap:6px}
.mc-global-identity .mc-feature-tile{height:58px;min-width:108px;border-radius:11px}
.mc-global-identity .mc-feature-label{font-size:10px;bottom:16px}
.mc-global-identity .mc-feature-caption{font-size:6px;bottom:5px}
.mc-quick-actions{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,1fr));
  gap:10px;
}
.mc-quick-card{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 14px;
  border-radius:14px;
  border:1px solid rgba(49,133,181,.35);
  background:linear-gradient(145deg,rgba(13,39,59,.97),rgba(6,20,32,.98));
  box-shadow:0 12px 24px rgba(0,0,0,.18);
}
.mc-quick-card .icon{
  width:36px;height:36px;border-radius:12px;display:flex;align-items:center;justify-content:center;
  font-size:18px;background:rgba(18,184,255,.14);border:1px solid rgba(18,184,255,.28);color:#DFF7FF;
}
.mc-quick-card .label{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:15px;letter-spacing:.04em;color:#F4F8FC;text-transform:uppercase}
.mc-quick-card .caption{font-size:10px;color:#8CA7BA;line-height:1.2;margin-top:2px}
.mc-quick-card:active{transform:translateY(1px)}
.mc-home-hero-panel{
    position:relative;overflow:hidden;border-radius:22px;padding:18px 16px 14px;border:1px solid rgba(49,133,181,.35);
    background-position:center;background-size:cover;
  box-shadow:0 18px 42px rgba(0,0,0,.3);
}
.mc-home-hero-panel::before{
    content:"";position:absolute;inset:0;background:linear-gradient(90deg,rgba(3,12,21,.98) 0%,rgba(4,16,27,.84) 52%,rgba(4,16,27,.35) 100%),linear-gradient(0deg,rgba(2,8,14,.88),transparent 55%);
}
.mc-home-hero-panel > * { position:relative; z-index:1; }
.mc-home-brand{display:flex;align-items:center;justify-content:space-between;padding:2px 2px 0}
.mc-home-brand-main{display:flex;align-items:center;gap:9px}
.mc-home-brand-main img{width:38px;height:38px;object-fit:contain;border-radius:11px;border:1px solid rgba(70,185,255,.5);box-shadow:0 0 18px rgba(0,174,255,.2)}
.mc-home-brand-title{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:15px;letter-spacing:.12em;color:#F4F8FC;text-transform:uppercase}
.mc-home-brand-sub{font-size:9px;color:#7FA4B9;margin-top:2px}
.mc-home-brand-action{width:36px;height:36px;border-radius:11px;background:#0C2538;border:1px solid #1D5275;color:#BFE9FF;font-size:16px}
.mc-cycle-alert{display:flex;align-items:center;gap:10px;padding:12px 13px;border-radius:15px;background:linear-gradient(135deg,rgba(242,201,76,.14),rgba(18,184,255,.08));border:1px solid rgba(242,201,76,.52)}
.mc-cycle-alert .copy{flex:1;min-width:0}
.mc-cycle-alert .title{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:15px;color:#FFE7A0;text-transform:uppercase;letter-spacing:.04em}
.mc-cycle-alert .text{margin-top:3px;color:#B3C3CE;font-size:10px;line-height:1.35}
.mc-cycle-alert button{flex:0 0 auto;padding:8px 10px;border-radius:10px;background:#F2C94C;border:0;color:#06101A;font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:10px;font-weight:800;text-transform:uppercase}
.mc-program-check{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;padding:12px;border-radius:15px;background:linear-gradient(145deg,rgba(13,39,59,.96),rgba(6,20,32,.98));border:1px solid rgba(49,151,198,.5)}
.mc-program-check .item{min-width:0;padding:8px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.07)}
.mc-program-check .label{display:block;color:#7795A8;font-size:8px;letter-spacing:.08em;text-transform:uppercase}
.mc-program-check .value{display:block;margin-top:4px;color:#F4F8FC;font-family:'IBM Plex Mono',monospace;font-size:12px;font-weight:700;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mc-eight-week-preview{display:flex;flex-direction:column;gap:6px;padding:12px;border-radius:15px;background:linear-gradient(145deg,rgba(13,39,59,.96),rgba(6,20,32,.98));border:1px solid rgba(49,151,198,.5)}
.mc-eight-week-row{display:grid;grid-template-columns:34px 1fr auto;align-items:center;gap:8px;padding:8px 9px;border-radius:10px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06)}
.mc-eight-week-row.active{background:rgba(18,184,255,.12);border-color:#12B8FF}
.mc-eight-week-row .week{font-family:'IBM Plex Mono',monospace;color:#7C97AA;font-size:10px}
.mc-eight-week-row .bar{height:6px;border-radius:999px;background:#102334;overflow:hidden}
.mc-eight-week-row .bar span{display:block;height:100%;border-radius:inherit;background:linear-gradient(90deg,#1478FF,#00BFFF,#25E0A1)}
.mc-eight-week-row .details{font-family:'IBM Plex Mono',monospace;color:#BFD0DD;font-size:9px;white-space:nowrap}
.mc-question-impact{margin-top:-10px;padding:9px 11px;border-left:2px solid #12B8FF;background:rgba(18,184,255,.08);color:#9DB8C8;font-size:11px;line-height:1.4}
.mc-compact .mc-v12-card,.mc-compact .mc-glass{padding:11px!important}
.mc-compact .mc-mobile-frame{gap:10px!important}
.mc-compact .mc-media-card img{height:104px}
.mc-compact .mc-section-title{font-size:11px}
.mc-home-hero-top{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.mc-home-badge{display:inline-flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;background:rgba(18,184,255,.12);border:1px solid rgba(18,184,255,.26);color:#BFEFFF;font-size:9px;letter-spacing:.08em;text-transform:uppercase}
.mc-home-badge strong{font-family:'IBM Plex Mono',monospace;font-weight:700}
.mc-home-title{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:28px;line-height:1;color:#fff;margin:0;text-transform:uppercase;letter-spacing:.03em}
.mc-home-sub{margin-top:6px;color:#A9C0D0;font-size:11px;line-height:1.4}
.mc-home-metrics{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:18px}
.mc-home-metrics .metric{padding:10px 8px;border-radius:12px;background:rgba(255,255,255,.04);border:1px solid rgba(255,255,255,.08)}
.mc-home-metrics .metric .label{display:block;color:#7C97AA;font-size:9px;text-transform:uppercase;letter-spacing:.08em}
.mc-home-metrics .metric .value{display:block;margin-top:4px;color:#fff;font-family:'IBM Plex Mono',monospace;font-weight:700;font-size:13px}
.mc-home-plan{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:14px;margin-top:14px;background:rgba(7,22,33,.75);border:1px solid rgba(18,184,255,.24)}
.mc-home-plan .left{display:flex;flex-direction:column;gap:3px}
.mc-home-plan .small{font-size:9px;letter-spacing:.08em;text-transform:uppercase;color:#7CA3B8}
.mc-home-plan .big{font-family:'Big Shoulders Display','Arial Narrow',sans-serif;font-size:18px;color:#fff;letter-spacing:.04em}
.mc-home-plan .pill{padding:7px 10px;border-radius:999px;background:linear-gradient(135deg,rgba(18,184,255,.25),rgba(39,216,155,.18));border:1px solid rgba(39,216,155,.25);color:#DFF9FA;font-size:9px;font-weight:700;letter-spacing:.08em;text-transform:uppercase}
.mc-visual-banner{
  height:150px;border-radius:18px;overflow:hidden;position:relative;
  border:1px solid rgba(25,137,211,.45);
  background:#071522;
  box-shadow:0 20px 45px rgba(0,0,0,.4),0 0 28px rgba(0,150,255,.09);
}
.mc-visual-banner img{width:100%;height:100%;object-fit:cover;display:block;filter:saturate(1.1) contrast(1.05);background:linear-gradient(135deg,#0B2237,#06101A)}
.mc-visual-overlay{
  position:absolute;inset:0;
  background:linear-gradient(90deg,rgba(2,10,17,.93) 0%,rgba(2,10,17,.58) 44%,rgba(2,10,17,.08) 100%),linear-gradient(0deg,rgba(0,0,0,.72),transparent 60%);
}
.mc-visual-copy{position:absolute;left:16px;right:16px;bottom:15px}
.mc-visual-kicker{font:700 9px 'IBM Plex Mono',monospace;letter-spacing:.12em;color:#50CFFF}
.mc-visual-title{font:800 25px 'Big Shoulders Display','Arial Narrow',sans-serif;line-height:.98;color:#fff;margin-top:4px;text-transform:uppercase}
.mc-visual-caption{font-size:9px;color:#A9C1D0;margin-top:5px;max-width:75%}
.mc-image-badge{
  position:absolute;left:14px;bottom:14px;padding:7px 10px;border-radius:999px;
  background:rgba(2,11,18,.76);border:1px solid rgba(55,173,239,.45);
  color:#BDEAFF;font:700 9px 'IBM Plex Mono',monospace;letter-spacing:.08em;backdrop-filter:blur(10px)
}
.mc-splash-video{
  position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.55;
  filter:saturate(1.08) contrast(1.08);animation:mcKen 8s ease-in-out infinite alternate;
}
@keyframes mcKen{from{transform:scale(1)}to{transform:scale(1.045)}}
.mc-splash:after{
  background:radial-gradient(circle at 50% 38%,rgba(0,170,255,.20),transparent 38%),linear-gradient(180deg,rgba(0,0,0,.18),rgba(0,0,0,.9)) !important;
}
.mc-splash-logo{box-shadow:0 0 55px rgba(0,174,255,.46)!important}
@media(max-width:520px){
  .mc-feature-strip{grid-template-columns:none}
  .mc-feature-tile{min-width:112px}
  .mc-visual-banner{height:145px}
  .mc-visual-title{font-size:23px}
}

/* V13 — coach intelligence, two-row navigation, resilient media and guided inputs */
.mc-v12-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.mc-v12-card{background:linear-gradient(145deg,rgba(13,34,51,.94),rgba(7,19,29,.96));border:1px solid #1D405B;border-radius:16px;padding:14px;box-shadow:0 12px 28px rgba(0,0,0,.18)}
.mc-v12-card h3{margin:0;font-family:var(--mc-display,Impact,'Arial Narrow',sans-serif);font-size:14px;letter-spacing:.04em}
.mc-v12-muted{color:#8FA8BA;font-size:10px;line-height:1.5}
.mc-v12-value{font-family:var(--mc-data,'IBM Plex Mono',monospace);font-weight:800;color:#F4F8FC}
.mc-v12-pill{border:1px solid #1D405B;background:#0B1C2B;border-radius:999px;padding:5px 8px;font-size:9px;color:#A9C0D0}
.mc-v12-btn{border:1px solid #1D405B;background:#0B1C2B;color:#CFE6F2;border-radius:10px;padding:9px 10px;font-size:10px}
.mc-v12-btn.active{border-color:#12B8FF;background:rgba(18,184,255,.13);color:#fff}
.mc-v12-modal{position:fixed;inset:0;z-index:10020;background:rgba(2,8,13,.78);backdrop-filter:blur(8px);display:flex;align-items:flex-end;justify-content:center}
.mc-v12-sheet{width:min(100%,520px);max-height:88vh;overflow:auto;background:#071522;border:1px solid #1D405B;border-radius:24px 24px 0 0;padding:18px;box-shadow:0 -20px 60px rgba(0,0,0,.45)}
.mc-v12-bar{height:8px;background:#0D2233;border-radius:999px;overflow:hidden}.mc-v12-bar>span{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#087CFF,#12B8FF,#27D89B)}
@media(max-width:360px){.mc-v12-grid{grid-template-columns:1fr}}

.mc-light .mc-v12-card,.mc-light .mc-glass{background:#ffffff !important;border-color:#D6E3EC !important;color:#102334 !important;box-shadow:0 8px 30px rgba(16,35,52,.06)}
.mc-light .mc-v12-muted,.mc-light .mc-stat span{color:#60798B !important}
.mc-light .mc-stat strong,.mc-light h3,.mc-light .mc-section-title{color:#102334 !important}
.mc-light .mc-v12-btn{background:#F1F6FA !important;color:#183348 !important;border-color:#CBDCE7 !important}
.mc-light .mc-v12-btn.active{background:#12B8FF !important;color:#06101A !important;border-color:#12B8FF !important}
.mc-light input,.mc-light select{background:#fff !important;color:#102334 !important;border-color:#CBDCE7 !important}

/* Final theme pass: clearer hierarchy and stronger interaction states. */
:root{
    --mc-ink:#06101A;
    --mc-panel:#0A1C2A;
    --mc-panel-raised:#10283A;
    --mc-line:#245675;
    --mc-cyan:#18C8FF;
    --mc-lime:#35E0A0;
}
.mc-shell{
    background:
        radial-gradient(700px 360px at 12% 0%,rgba(24,200,255,.13),transparent 65%),
        radial-gradient(620px 380px at 88% 10%,rgba(53,224,160,.08),transparent 65%),
        linear-gradient(180deg,#06121D 0%,#071827 55%,#040C14 100%) !important;
}
.mc-shell button:not(:disabled),.mc-shell a{
    transition:transform .16s ease,background-color .16s ease,border-color .16s ease,box-shadow .16s ease,color .16s ease;
}
.mc-shell button:not(:disabled):hover,.mc-shell a:hover{
    border-color:rgba(24,200,255,.75) !important;
    box-shadow:0 0 0 1px rgba(24,200,255,.12),0 8px 22px rgba(0,0,0,.2);
}
.mc-shell button:not(:disabled):active{transform:translateY(1px)}
.mc-shell button:focus-visible,.mc-shell input:focus-visible,.mc-shell select:focus-visible{
    outline:2px solid var(--mc-cyan);
    outline-offset:2px;
}
.mc-shell input,.mc-shell select{
    background:rgba(8,28,43,.92) !important;
    border-color:rgba(55,128,164,.62) !important;
}
.mc-shell input::placeholder{color:#7795A8 !important}
.mc-shell .mc-glass{
    background:linear-gradient(145deg,rgba(13,39,59,.97),rgba(6,20,32,.98)) !important;
    border-color:rgba(49,151,198,.5) !important;

// --- Local storage shim (replaces Claude's window.storage, same async interface) ---
const storage = {
    get: async function (key) {
        try {
            const raw = localStorage.getItem("wt_" + key);
            if (raw === null)
                return null;
            return { key: key, value: raw, shared: false };
        }
        catch (e) {
            return null;
        }
    },
    set: async function (key, value) {
        try {
            localStorage.setItem("wt_" + key, value);
            return { key: key, value: value, shared: false };
        }
        catch (e) {
            return null;
        }
    },
    delete: async function (key) {
        try {
            localStorage.removeItem("wt_" + key);
            return { key: key, deleted: true, shared: false };
        }
        catch (e) {
            return null;
        }
    },
    list: async function (prefix) {
        try {
            const p = "wt_" + (prefix || "");
            const keys = Object.keys(localStorage)
                .filter((k) => k.startsWith(p))
                .map((k) => k.slice(3));
            return { keys: keys, shared: false };
        }
        catch (e) {
            return null;
        }
    },
};
window.storage = storage;

// Anatomical classification used by the library/statistics layer.
// "portion" is the primary target used for tracking; secondaryPortions keeps
// useful secondary involvement without double-counting it as the main target.
function classifyPortion(category, subgroup = "", exerciseName = "") {
    const s = subgroup.toLowerCase();
    const n = exerciseName.toLowerCase();
    if (category === "Pectoraux") {
        // "Milieu/bas" is primarily horizontal/mid-chest work; only a true
        // decline/lower-pec label should be counted as lower chest.
        if (s.includes("milieu"))
            return "Milieu des pectoraux";
        if (s.includes("haut"))
            return "Haut des pectoraux";
        if (s.includes("bas") || n.includes("déclin") || n.includes("decline") || n.includes("dips"))
            return "Bas des pectoraux";
        return "Milieu des pectoraux";
    }
    if (category === "Épaules") {
        if (n.includes("latérale") || n.includes("laterale"))
            return "Deltoïde latéral";
        if (n.includes("oiseau") || n.includes("rear delt") || n.includes("face pull"))
            return "Deltoïde postérieur";
        if (s.includes("postérieur") || s.includes("arrière"))
            return "Deltoïde postérieur";
        if (s.includes("latéral"))
            return "Deltoïde latéral";
        return "Deltoïde antérieur";
    }
    if (category === "Dos") {
        if (n.includes("extension lombaire") || n.includes("superman"))
            return "Lombaires";
        if (s.includes("lombaire") || s.includes("bas du dos"))
            return "Lombaires";
        if (n.includes("soulevé de terre") || n.includes("souleve de terre"))
            return "Lombaires";
        if (n.includes("rowing") || n.includes("tirage horizontal"))
            return "Milieu / épaisseur du dos";
        if (s.includes("épaisseur"))
            return "Milieu / épaisseur du dos";
        return "Grand dorsal / largeur";
    }
    if (category === "Trapèzes") {
        // "moyen/inférieur" is tracked as the mid-trap primary target.
        if (s.includes("moyen"))
            return "Trapèze moyen";
        if (s.includes("inférieur"))
            return "Trapèze inférieur";
        return "Trapèze supérieur";
    }
    if (category === "Biceps") {
        if (n.includes("marteau") || n.includes("hammer") || n.includes("zottman") || n.includes("inversé"))
            return "Brachial";
        if (s.includes("brachial"))
            return "Brachial";
        if (s.includes("courte"))
            return "Biceps — courte portion";
        return "Biceps — longue portion";
    }
    if (category === "Triceps") {
        if (n.includes("prise inversée"))
            return "Triceps — portion médiale";
        if (n.includes("poulie") && !n.includes("nuque"))
            return "Triceps — portion latérale";
        if (s.includes("médiale"))
            return "Triceps — portion médiale";
        if (s.includes("latérale"))
            return "Triceps — portion latérale";
        return "Triceps — longue portion";
    }
    if (category === "Jambes") {
        if (s.includes("isolation") || s.includes("extension") || n.includes("leg extension") || n.includes("sissy"))
            return "Quadriceps — isolation";
        return "Quadriceps — global";
    }
    if (category === "Ischios/Fessiers") {
        if (s.includes("fessier") || n.includes("hip thrust") || n.includes("glute") || n.includes("kickback") || n.includes("donkey"))
            return "Fessiers — grand fessier";
        return "Ischio-jambiers";
    }
    if (category === "Mollets") {
        if (s.includes("soléaire") || s.includes("assis") || n.includes("assis"))
            return "Soléaire";
        return "Gastrocnémien";
    }
    if (category === "Core") {
        if (s.includes("oblique") || s.includes("anti-rotation") || n.includes("pallof") || n.includes("rotation"))
            return "Obliques";
        if (s.includes("transverse") || s.includes("stabilité") || s.includes("gainage") || n.includes("dead bug") || n.includes("planche"))
            return "Transverse / stabilité";
        return "Grand droit";
    }
    if (category === "Avant-bras") {
        if (s.includes("fléchisseur")) return "Fléchisseurs du poignet";
        if (s.includes("extenseur")) return "Extenseurs du poignet";
        if (s.includes("brachio")) return "Brachio-radial";
        return "Prise / avant-bras";
    }
    if (category === "Adducteurs/Abducteurs") {
        if (s.includes("adducteur")) return s.includes("stabilité") ? "Adducteurs / stabilité" : "Adducteurs";
        return "Abducteurs / moyen fessier";
    }
    return subgroup || category;
}
function getSecondaryPortions(category, name = "", subgroup = "") {
    const n = `${name} ${subgroup}`.toLowerCase();
    if (category === "Pectoraux")
        return n.includes("incliné") || n.includes("incline") ? ["Deltoïde antérieur", "Triceps"] : ["Triceps", "Deltoïde antérieur"];
    if (category === "Dos")
        return [n.includes("tirage") || n.includes("traction") ? "Biceps" : "Biceps", "Deltoïde postérieur"];
    if (category === "Épaules")
        return n.includes("latérale") || n.includes("laterale") ? ["Deltoïde antérieur", "Deltoïde postérieur"] : ["Deltoïde latéral"];
    if (category === "Jambes")
        return ["Fessiers", "Ischio-jambiers"];
    if (category === "Ischios/Fessiers")
        return n.includes("fessier") || n.includes("hip thrust") || n.includes("bridge") ? ["Ischio-jambiers"] : ["Fessiers — grand fessier"];
    if (category === "Biceps")
        return ["Avant-bras"];
    if (category === "Triceps")

function getWeeklyVolumeTargets(answers) {

        intermediaire: { major: 10, shoulders: 7, arms: 6, calves: 5, core: 5, traps: 4, forearms: 3, adductors: 3 },
        confirme: { major: 12, shoulders: 9, arms: 8, calves: 6, core: 6, traps: 5, forearms: 4, adductors: 4 },

        const raw = Math.round(p.major * goalFactor * dayFactor * recoveryFactor * durationFactor * lowerFactor + (priority.has(g) ? 2 : 0));
        target[g] = Math.min(lowerMax, Math.max(4, raw));

    const safeTarget = Math.min(Math.max(minimum, Number(targetSets) || minimum), capacity);
    const sets = Array(exercises.length).fill(1);
    let remaining = safeTarget - minimum;
    while (remaining > 0) {

        for (let i = 0; i < sets.length; i++) {
            if (sets[i] >= caps[i]) continue;
            if (best < 0 || sets[i] < sets[best]) best = i;

        if (best < 0) break;
